  // Alias so the rest of the app can use the familiar React / ReactDOM names.
  window.React = window.preactCompat;
  window.ReactDOM = window.preactCompat;
</script>
<title>My Quran Journal — The Light of My Heart</title>
<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
  #error-box { display: none; font-family: monospace; white-space: pre-wrap; background: #fee; color: #900; padding: 1rem; border: 2px solid #c00; margin: 1rem; border-radius: 8px; }
</style>
<!-- ===== PWA: service worker registration ===== -->
<!-- Relative path ("service-worker.js", no leading slash) so this works whether the
     site is hosted at the domain root or under a GitHub Pages subpath like
     https://username.github.io/repo-name/ -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function (err) {
        console.warn("Service worker registration failed:", err);
      });
    });
  }
</script>
</head>
<body>
<div id="error-box"></div>
<div id="root">
  <div style="font-family: sans-serif; text-align: center; padding: 4rem 1rem; color: #9C8B7A;">
    <p>Loading your Quran Journal...</p>
    <p style="font-size: 0.85rem;">If this message doesn't disappear, your browser's security settings may be blocking local scripts when opening this file directly.<br/>Try using VS Code's "Open with Live Server" extension instead of double-clicking the file, or open it in Chrome/Edge/Firefox directly.</p>
  </div>
</div>
<script>
  window.addEventListener('error', function (e) {
    var box = document.getElementById('error-box');
    box.style.display = 'block';
    var detail = e.error && e.error.stack ? e.error.stack : e.message;
    box.textContent = 'Error: ' + detail + '\n' + (e.filename || '') + ':' + (e.lineno || '') +
      '\n\nIf this just says "Script error." with no other detail, open your browser\'s DevTools console (F12) to see the full error — some browsers hide details for scripts loaded from a different origin.';
  });
</script>
<script>
"use strict";
const { useState, useEffect, useRef } = React;
// ---- Local persistence (this file is meant to be saved and reopened, so we
// use localStorage — it lives in the reader's own browser, tied to this file). ----
const STORAGE_KEY = "quranJournal.v1";
function loadJournalState() {
    try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw)
            return null;
        return JSON.parse(raw);
    }
    catch (err) {
        console.warn("Could not load saved journal data:", err);
        return null;
    }
}
function saveJournalState(state) {
    try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return true;
    }
    catch (err) {
        console.warn("Could not save journal data:", err);
        return false;
    }
}
function getDateKey(d) {
    return d.toISOString().split("T")[0];
}
// ===== Reminder push notifications =====
//
// Reminder backend deployed 2026-09-01.
const PUSH_SERVER_URL = "https://quran-journal-push.razanquranjournal.workers.dev";
function isPushBackendConfigured() {
    return typeof PUSH_SERVER_URL === "string" && PUSH_SERVER_URL.indexOf("YOUR-WORKER-NAME") === -1;
}
// Web Push requires the VAPID public key as a Uint8Array, but servers hand it out
// as a URL-safe base64 string — this is the standard conversion between the two.
function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++)
        outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
}
// On iPhone/iPad, Safari only exposes the Push API to a copy of the site that's
// been added to the Home Screen — a normal browser tab can't use it at all, by
// Apple's own design (not something this app can work around).
function isIOS() {
    return /iphone|ipad|ipod/i.test(window.navigator.userAgent || "");
}
function isIOSStandalone() {
    return window.navigator.standalone === true;
}
function isPushSupported() {
    return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}
async function subscribeToPush() {
    const reg = await navigator.serviceWorker.ready;
    let subscription = await reg.pushManager.getSubscription();
    if (!subscription) {
        const keyRes = await fetch(PUSH_SERVER_URL + "/vapid-public-key");
        if (!keyRes.ok)
            throw new Error("Could not reach the reminder server.");
        const { publicKey } = await keyRes.json();
        subscription = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey),
        });
    }

const KAABA_LNG = 39.8262;

// Standard great-circle initial bearing formula, giving the compass bearing
// (0-360°, clockwise from true North) from a point to the Kaaba.
function computeQiblaBearing(lat, lng) {
    const toRad = (d) => (d * Math.PI) / 180;
    const toDeg = (r) => (r * 180) / Math.PI;
    const phi1 = toRad(lat);
    const lambda1 = toRad(lng);
    const phi2 = toRad(KAABA_LAT);
    const lambda2 = toRad(KAABA_LNG);
    const dLambda = lambda2 - lambda1;
    const y = Math.sin(dLambda) * Math.cos(phi2);
    const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLambda);
    const theta = Math.atan2(y, x);
    return (toDeg(theta) + 360) % 360;
}

            const osc = ctx.createOscillator();

async function fetchPrayerTimesOnline(lat, lng, method, timezone) {

    const timeoutMs = 12000;
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    const today = new Date();
    const dateStr = `${pad2(today.getDate())}-${pad2(today.getMonth() + 1)}-${today.getFullYear()}`;
    let res;
    try {
        const url = `https://api.aladhan.com/v1/timings/${dateStr}?latitude=${lat}&longitude=${lng}&method=${method}&timezonestring=${encodeURIComponent(timezone || "UTC")}`;

    }
    catch (err) {
        if (err && err.name === "AbortError") {
            throw new Error(`Timed out after ${timeoutMs / 1000}s waiting for the prayer times service.`);
        }
        throw err;
    }
    finally {
        clearTimeout(timeoutId);
    }
    if (!res.ok)
        throw new Error("Network response was not ok (" + res.status + ")");

        throw new Error("Unexpected response from the prayer times service.");

}

    { number: 2, arabic: "البقرة", name: "Al-Baqarah", meaning: "The Cow", type: "Madani", ayahs: 286, themes: ["Guidance for believers", "Stories of Bani Israel", "Laws of Islam", "The nature of faith and hypocrisy", "Ayatul Kursi"], summary: "Al-Baqarah is the longest Surah in the Quran and a complete guide for life. It covers faith, prayer, fasting, hajj, marriage, business ethics, and so much more. It tells the stories of Prophet Adam, Ibrahim, and Bani Israel to teach timeless lessons about obedience and gratitude.", tafsir: "This Surah was revealed over many years in Madinah and addresses the early Muslim community directly. It begins by describing three types of people: believers, disbelievers, and hypocrites. The story of the cow (Al-Baqarah) teaches obedience without questioning. Ayatul Kursi (2:255) is the greatest verse in the Quran, describing Allah's limitless power. The Surah ends with duas for Allah's mercy and the reminder that Allah does not burden a soul beyond what it can bear.", favoriteAyah: { arabic: "لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا", english: "Allah does not burden a soul beyond that it can bear.", explanation: "One of the most healing verses in the entire Quran. No matter what you are going through, Allah knows your limit — and you are stronger than you think." }, dua: "O Allah, do not burden us with more than we can bear. Forgive our mistakes, have mercy on us, and help us against those who deny the truth. You are our Protector. Ameen." },
    { number: 3, arabic: "آل عمران", name: "Al-Imran", meaning: "Family of Imran", type: "Madani", ayahs: 200, themes: ["Tawheed", "Stories of Maryam and Isa", "Battle of Uhud lessons", "Patience in hardship", "True belief"], summary: "Al-Imran is named after the family of Imran — the grandfather of Prophet Isa (Jesus). It continues many themes from Al-Baqarah and gives beautiful accounts of Maryam's devotion, the birth of Isa, and lessons from the Battle of Uhud.", tafsir: "This Surah was revealed partly before and after the Battle of Uhud. It addresses the Christians of Najran who came to debate with the Prophet. It clarifies that Isa was a prophet of Allah, born miraculously, but is not divine. The Surah teaches that victory comes from patience and trust in Allah — lessons drawn from Uhud, where the Muslims' disobedience led to hardship. It contains the famous verse about those who spend in ease and hardship, control anger, and forgive others.", favoriteAyah: { arabic: "وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ", english: "And hasten to forgiveness from your Lord.", explanation: "Allah calls us to rush toward His forgiveness — not to delay, not to think we are too sinful. His mercy is always open. This verse is both a calling and a comfort." }, dua: "O Allah, make us among those who listen to Your word and follow the best of it. Forgive our sins, keep our hearts steadfast, and grant us the highest level of Jannah. Ameen." },
    { number: 4, arabic: "النساء", name: "An-Nisa", meaning: "The Women", type: "Madani", ayahs: 176, themes: ["Rights of women", "Inheritance laws", "Marriage and family", "Justice and equality", "Treatment of orphans"], summary: "An-Nisa is dedicated to the rights and dignities of women — a revolutionary chapter for its time. It establishes laws of inheritance, marriage, and family, and demands justice for the vulnerable, especially women and orphans.", tafsir: "Revealed after the Battle of Uhud when many men had died, leaving widows and orphans, this Surah addressed the social crisis directly. It establishes that women have equal spiritual standing before Allah, rights to inheritance, and the right to be treated with kindness. It warns severely against mistreating orphans or women. It also addresses the hypocrites and enemies of Islam, reminding believers to uphold justice even against themselves.", favoriteAyah: { arabic: "يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمُ الَّذِي خَلَقَكُم مِّن نَّفْسٍ وَاحِدَةٍ", english: "O mankind, fear your Lord, who created you from one soul.", explanation: "We all come from one source — this verse is a reminder of our shared humanity and our equal standing before Allah, regardless of gender, race, or background." }, dua: "O Allah, make us among those who uphold justice and protect the vulnerable. Soften our hearts toward the weak, and keep us away from oppression in any form. Ameen." },
    { number: 5, arabic: "المائدة", name: "Al-Maidah", meaning: "The Table Spread", type: "Madani", ayahs: 120, themes: ["Fulfilling promises", "Halal food", "Interfaith relations", "Justice", "The table of food for Isa's disciples"], summary: "Al-Maidah covers the completion of Islamic law, including food laws, fulfilling promises, and fair dealings with all people. It ends with the miraculous table of food that the disciples of Isa requested from Allah.", tafsir: "This Surah is one of the last revealed, containing some final rulings of Islam. It opens with 'O you who believe, fulfill your contracts' — reminding us that keeping our word is central to faith. It clarifies what food is permissible, discusses the covenant of the Torah and Gospels, and warns about those who distort Allah's word. The story of the miraculous table (ma'idah) sent down for Isa's disciples illustrates divine generosity and the consequences of ingratitude.", favoriteAyah: { arabic: "الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ", english: "This day I have perfected for you your religion.", explanation: "Revealed on the Day of Arafah, this verse declared Islam complete. It is one of the most significant verses in the Quran — a divine announcement that the message is whole and perfect." }, dua: "O Allah, help us to keep our promises, to be truthful, and to fulfill our obligations to You and to others. Make us people of integrity and honor. Ameen." },
    { number: 6, arabic: "الأنعام", name: "Al-Anam", meaning: "The Cattle", type: "Makki", ayahs: 165, themes: ["Tawheed", "Rejection of polytheism", "Evidence of Allah's existence", "Prophet Ibrahim's journey to truth"], summary: "Al-Anam is a powerful defense of monotheism. It uses logic, nature, and the story of Ibrahim's search for truth to prove that Allah alone deserves worship — and that all other deities are false.", tafsir: "Revealed all at once in Makkah, this Surah addresses the Quraysh's polytheism with evidence from nature and reason. It follows Prophet Ibrahim as he looks at stars, the moon, and the sun — only to reject them all and declare Allah as his only Lord. The Surah refutes superstitions about certain animals being sacred and emphasizes that guidance comes only from Allah. It ends with a reminder of the straight path and gratitude for the Quran.", favoriteAyah: { arabic: "وَعِندَهُ مَفَاتِحُ الْغَيْبِ لَا يَعْلَمُهَا إِلَّا هُوَ", english: "With Him are the keys of the unseen — no one knows them except Him.", explanation: "A breathtaking reminder of Allah's infinite knowledge. He knows what is hidden from all of us — and that is both humbling and deeply reassuring." }, dua: "O Allah, You are the All-Knowing, the All-Seeing. Guide us to what pleases You and protect us from what displeases You. Keep our hearts pure and our faith unshakeable. Ameen." },
    { number: 7, arabic: "الأعراف", name: "Al-Araf", meaning: "The Heights", type: "Makki", ayahs: 206, themes: ["Stories of past prophets", "Adam and Iblis", "Nations who rejected their prophets", "The Heights between heaven and hell"], summary: "Al-Araf tells the stories of many prophets — from Adam to Musa — and the nations that rejected them. It warns of the consequences of arrogance and ingratitude, and describes Al-Araf, the heights between Jannah and Jahannam.", tafsir: "This Surah begins with the story of Adam and Iblis — the original test of arrogance vs. submission. Iblis refused to bow to Adam out of pride and became humanity's sworn enemy. The Surah then traces the missions of Prophets Nuh, Hud, Salih, Lut, and Shuaib — all of whom were rejected. Each story follows the same pattern: warning, rejection, punishment. The lesson is clear: arrogance destroys, and humility before Allah leads to salvation.", favoriteAyah: { arabic: "إِنَّ رَحْمَتَ اللَّهِ قَرِيبٌ مِّنَ الْمُحْسِنِينَ", english: "Indeed, the mercy of Allah is near to those who do good.", explanation: "No matter how far you feel from Allah, His mercy is always closer than you think — especially for those who strive to be good." }, dua: "O Allah, protect us from the arrogance of Iblis and keep our hearts humble before You. We seek Your mercy and ask You to make us among the righteous. Ameen." },
    { number: 8, arabic: "الأنفال", name: "Al-Anfal", meaning: "The Spoils of War", type: "Madani", ayahs: 75, themes: ["Battle of Badr", "Trust in Allah during hardship", "Loyalty and brotherhood", "The nature of true believers"], summary: "Al-Anfal was revealed after the Battle of Badr — the first major military victory of the Muslims. It addresses the distribution of war spoils, the qualities of true believers, and the importance of unity.", tafsir: "This Surah opens by answering a question about who owns the spoils of war — and the answer is Allah and His Prophet. It describes the Battle of Badr in vivid terms, emphasizing that the victory was purely from Allah, not from the Muslims' strength alone. Angels fought alongside the believers. It defines the qualities of true mu'mineen: those whose hearts tremble when Allah is mentioned, whose faith increases with His verses, and who rely only on Him.", favoriteAyah: { arabic: "إِنَّ اللَّهَ مَعَ الصَّابِرِينَ", english: "Indeed, Allah is with those who are patient.", explanation: "A simple yet incredibly powerful promise. In every difficulty, every hardship, every moment of struggle — Allah is with you. Always." }, dua: "O Allah, make us among the patient ones. When trials come, let our hearts hold firm. Grant us Your company in our hardest moments and victory after our patience. Ameen." },
    { number: 9, arabic: "التوبة", name: "At-Tawbah", meaning: "The Repentance", type: "Madani", ayahs: 129, themes: ["Repentance", "Dealing with hypocrites", "Jihad and sacrifice", "Loyalty to Allah and His Messenger"], summary: "At-Tawbah is unique — it's the only Surah without Bismillah at the beginning. It is a powerful declaration about faith, loyalty, and repentance. It addresses the hypocrites, calls believers to sacrifice, and offers the beautiful promise of Allah's forgiveness.", tafsir: "This Surah was revealed in the final years of the Prophet's life. Its lack of Bismillah is significant — scholars say it begins with a stern warning rather than mercy, because it deals with treachery and hypocrisy. However, it also contains some of the most beautiful promises of forgiveness. Verse 9:104 says Allah accepts repentance and is the Ever-Merciful. The famous verse about the cave (9:40) refers to the Hijra — when the Prophet told Abu Bakr 'Do not grieve, indeed Allah is with us.'", favoriteAyah: { arabic: "إِنَّ اللَّهَ اشْتَرَىٰ مِنَ الْمُؤْمِنِينَ أَنفُسَهُمْ", english: "Indeed, Allah has purchased from the believers their lives and their properties.", explanation: "This is the most beautiful trade in existence. You give Allah your life and wealth — and He gives you Jannah in return. What a merciful Lord." }, dua: "O Allah, accept our repentance and purify our hearts. Do not let hypocrisy creep into our souls. Make us truly sincere in our faith and firm in our loyalty to You. Ameen." },
    { number: 10, arabic: "يونس", name: "Yunus", meaning: "Jonah", type: "Makki", ayahs: 109, themes: ["Prophet Yunus's story", "Signs of Allah in nature", "The mercy of Allah", "True and false belief"], summary: "Surah Yunus tells the story of Prophet Yunus — who left his people without permission and was swallowed by a whale, only to be saved by his sincere repentance inside the darkness.", tafsir: "This Surah focuses on the proof of Allah's existence through His signs in creation — the alternation of day and night, ships sailing on seas, rain giving life to dead earth. The story of Yunus teaches us that even prophets face tests and that turning back to Allah is always possible. Allah accepted Yunus's repentance in the belly of the whale — so He will certainly accept ours too. The Surah also addresses those who only call on Allah in hardship but forget Him in ease.", favoriteAyah: { arabic: "فَلَوْلَا كَانَتْ قَرْيَةٌ آمَنَتْ فَنَفَعَهَا إِيمَانُهَا إِلَّا قَوْمَ يُونُسَ", english: "Was there any city that believed and its faith benefited it? Yes — the people of Yunus.", explanation: "The people of Yunus are the ONLY nation in the Quran whose faith was accepted AFTER they saw the punishment coming. Their story is a sign of Allah's endless mercy." }, dua: "O Allah, like Yunus in the belly of darkness, we call out to You. There is no god but You. Glory be to You. We have indeed been wrongdoers. Save us, forgive us, and bring us back to You. Ameen." },
];
// Detailed entries for Surahs 11-30
const SURAHS_11_30 = [
    { number: 11, arabic: "هود", name: "Hud", meaning: "Hud (Prophet's name)", type: "Makki", ayahs: 123, themes: ["Stories of past prophets", "Patience of the Prophet", "Consequences of rejecting truth", "Steadfastness"], summary: "Surah Hud is a beautiful, sobering walk through the stories of many prophets — Nuh, Hud, Salih, Ibrahim, Lut, Shuaib, and Musa — each rejected by their people, each patient through it. It's a Surah that gently says: staying firm on truth is hard, but Allah sees every bit of your patience.", tafsir: "This Surah is named after Prophet Hud, who was sent to the people of 'Aad. The repeated pattern across all the prophets' stories — warning, mockery, destruction of the disbelievers, salvation of the believers — is meant to comfort the Prophet Muhammad ﷺ and the early Muslims who faced intense rejection in Makkah. The Surah teaches that every nation that mocked its prophet eventually fell, while the small group of believers was protected. It also commands the Prophet (and us) to 'stand firm as commanded' — istiqamah, steadfastness, is repeatedly emphasized as the key to surviving hardship.", favoriteAyah: { arabic: "وَاسْتَقِمْ كَمَا أُمِرْتَ", english: "So stand firm [in the way you were commanded].", explanation: "Such a short verse, yet it carries the weight of the whole Surah. Life will test you — but the instruction is simple: stay firm, keep going, don't waver." }, dua: "O Allah, grant us istiqamah — steadfastness on the truth, even when it's hard, even when we feel alone in it. Like the prophets before us, let our patience be rewarded with Your nearness. Ameen." },
    { number: 12, arabic: "يوسف", name: "Yusuf", meaning: "Joseph", type: "Makki", ayahs: 111, themes: ["Best of all stories", "Patience through betrayal", "Family trials and forgiveness", "Allah's perfect planning"], summary: "Surah Yusuf is called 'the most beautiful of stories' — and it truly is. It follows Prophet Yusuf from being thrown into a well by his own brothers, sold into slavery, falsely imprisoned, to becoming a powerful and forgiving leader who reunites with his family. It's a story about betrayal, patience, temptation, and the incredible way Allah turns pain into purpose.", tafsir: "Revealed as comfort to the Prophet Muhammad ﷺ during a year of immense grief (the Year of Sorrow), this Surah shows that even the most painful betrayals — by family, no less — can be part of a divine plan leading to something greater. Yusuf's response to his brothers after years of suffering was 'No blame upon you today' — a level of forgiveness that feels almost impossible, yet it's the example Allah gives us. The Surah also shows Yusuf's incredible self-control when tempted by Zulaikha, proving that piety means choosing Allah even in private, unseen moments.", favoriteAyah: { arabic: "إِنَّهُ مَن يَتَّقِ وَيَصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ", english: "Indeed, whoever fears Allah and is patient — then surely, Allah does not allow the reward of those who do good to be lost.", explanation: "A direct promise: your patience is not invisible to Allah. Whatever you're going through quietly, with sabr — it is being recorded and rewarded." }, dua: "O Allah, like Yusuf, give us the patience to endure betrayal and hardship without losing our faith. Help us forgive those who hurt us, and trust that whatever You plan for us is always better than what we planned for ourselves. Ameen." },
    { number: 13, arabic: "الرعد", name: "Ar-Rad", meaning: "The Thunder", type: "Madani", ayahs: 43, themes: ["Signs of Allah's power", "Thunder and lightning as signs", "Hearts finding peace through remembrance", "Truth versus falsehood"], summary: "Ar-Rad takes its name from the thunder — a powerful natural sign that glorifies Allah. The Surah is about recognizing Allah's might in nature, and finding real peace through dhikr (remembrance of Him), even when the world feels loud and overwhelming.", tafsir: "This Surah draws our attention outward — to the sky, the rain, the thunder — and inward, to the heart. It teaches that hearts find tranquility (sukoon) only through the remembrance of Allah, not through wealth, status, or worldly comfort. It also contrasts the believer's home in Paradise — described with gardens, rivers, and angels greeting them with peace — with the fate of those who broke their covenant with Allah. The central message: everything in creation, even thunder, is in submission to and praise of Allah.", favoriteAyah: { arabic: "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ", english: "Verily, in the remembrance of Allah do hearts find rest.", explanation: "One of the most quoted verses for anxiety and unrest — and for good reason. No amount of distraction calms the heart like turning back to Allah." }, dua: "O Allah, let my heart find true rest in remembering You. When the world feels loud and overwhelming, draw me back to dhikr, to prayer, to You — the only true source of peace. Ameen." },
    { number: 14, arabic: "إبراهيم", name: "Ibrahim", meaning: "Abraham", type: "Makki", ayahs: 52, themes: ["Gratitude vs ingratitude", "Ibrahim's powerful dua for his descendants", "The parable of the good and bad word", "Blessings as a trust"], summary: "Surah Ibrahim centers on gratitude — how Allah's blessings are a trust, and how nations either flourish through gratitude or collapse through ingratitude. It includes one of the most moving duas in the Quran, made by Prophet Ibrahim for his family and future generations.", tafsir: "The Surah opens by describing the Quran as a light sent to bring people 'out of darknesses into light.' It contrasts a 'good word' — like a strong tree with deep roots and abundant fruit — with a 'bad word' — like an uprooted tree with no stability, representing falsehood. Ibrahim's dua asks Allah to make Makkah a place of security, to keep his descendants away from idol worship, and to forgive his parents. It's a dua full of humility from a man Allah called His close friend (khalil), reminding us that even the greatest of believers turned to Allah in complete dependence.", favoriteAyah: { arabic: "وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ", english: "And [remember] when your Lord proclaimed: 'If you are grateful, I will surely increase you [in favor].'", explanation: "A simple but life-changing principle — gratitude isn't just good manners towards Allah, it's literally a key that unlocks more blessings." }, dua: "O Allah, like Ibrahim, I ask You to keep my heart and the hearts of my family firm on Your deen — for generations to come. Make me among those who are truly grateful, never taking Your blessings for granted. Ameen." },
    { number: 15, arabic: "الحجر", name: "Al-Hijr", meaning: "The Rocky Tract", type: "Makki", ayahs: 99, themes: ["Iblis's refusal and arrogance", "Allah's protection of the Quran", "Stories of past nations destroyed", "Comfort and patience for the Prophet"], summary: "Al-Hijr revisits the story of Iblis's refusal to bow to Adam — the origin of evil's enmity toward humans — and reassures the Prophet that Allah Himself protects the Quran from corruption, no matter how much people try to distort it.", tafsir: "This Surah is named after the rocky valley where the people of Thamud lived — another nation destroyed for rejecting their prophet (Salih). The Surah's most famous promise is in verse 9: 'Indeed, it is We who sent down the Quran, and indeed, We will be its guardian' — a guarantee that has held true for over 1400 years; the Quran remains unchanged. The story of Iblis here shows that arrogance (refusing to submit despite knowing the truth) is the root of all rebellion against Allah, and Iblis's punishment is a warning to anyone who follows his path of pride.", favoriteAyah: { arabic: "إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ", english: "Indeed, it is We who sent down the Quran, and indeed, We will be its guardian.", explanation: "A promise of divine protection over the Quran itself. No matter what happens in the world, this Book remains exactly as it was revealed — preserved by Allah's own guarantee." }, dua: "O Allah, protect my heart from the arrogance of Iblis. Let me always recognize the truth when I see it, and never let pride stand between me and submission to You. Ameen." },
    { number: 16, arabic: "النحل", name: "An-Nahl", meaning: "The Bee", type: "Makki", ayahs: 128, themes: ["Countless blessings of Allah", "The bee as a sign of divine design", "Gratitude and reflection", "Call to dawah with wisdom"], summary: "An-Nahl is sometimes called 'The Surah of Blessings' — it lists an overwhelming number of Allah's gifts: rain, livestock, ships, the sun and moon, honey from bees, and more — each one a sign for those who reflect. It's a Surah that turns gratitude into worship.", tafsir: "The bee is highlighted as a tiny creature that produces something with healing properties (honey) by divine inspiration — a sign of Allah's intricate design in even the smallest of His creations. The Surah repeatedly asks: with all these blessings around you, how can you deny your Creator? It also gives guidance on how to invite others to Islam — 'with wisdom and good instruction' — emphasizing gentleness over harshness. The final verses promise that those who are patient and do good will be rewarded even better than what they did.", favoriteAyah: { arabic: "ادْعُ إِلَى سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ", english: "Invite to the way of your Lord with wisdom and good instruction.", explanation: "A timeless guide for how to share faith — not with arguments or harshness, but with wisdom, kindness, and good example. Dawah begins with how we treat people." }, dua: "O Allah, open my eyes to the countless blessings around me that I often overlook. Make me truly grateful, and let my words and actions reflect wisdom and kindness to everyone I meet. Ameen." },
    { number: 17, arabic: "الإسراء", name: "Al-Isra", meaning: "The Night Journey", type: "Makki", ayahs: 111, themes: ["The Prophet's Night Journey to Jerusalem and ascension", "Rights of parents", "Ten foundational commandments", "Humility and gratitude"], summary: "Al-Isra recounts the miraculous Night Journey — when the Prophet Muhammad ﷺ traveled from Makkah to Jerusalem and then ascended through the heavens, all in one night. The Surah then lays out beautiful, practical guidance for everyday life, especially around honoring parents.", tafsir: "The Night Journey (Isra and Mi'raj) was both a miracle and a comfort — coming after years of persecution, it reassured the Prophet of Allah's closeness and power, beyond what the eye can see. The Surah then shifts to very grounded, human commandments: be kind to parents, don't waste money, don't kill unjustly, fulfill promises, give full measure in trade, walk with humility, and don't follow what you have no knowledge of. The verses on parents (17:23-24) are some of the most tender in the Quran — even telling us not to say a single harsh word to them in their old age.", favoriteAyah: { arabic: "وَقُل رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", english: "And say: 'My Lord, have mercy upon them as they brought me up when I was small.'", explanation: "A dua every child should make for their parents — a reminder that their sacrifices for us deserve a lifetime of gratitude, kindness, and prayer." }, dua: "O Allah, have mercy on my parents as they raised me when I was small and unable to care for myself. Grant me the patience and gentleness to honor them, and grant me the humility shown in this Surah's guidance for daily life. Ameen." },
    { number: 18, arabic: "الكهف", name: "Al-Kahf", meaning: "The Cave", type: "Makki", ayahs: 110, themes: ["People of the Cave", "Protection from Dajjal", "Trials of wealth, knowledge, power, and desire", "Patience and trust in Allah's plan"], summary: "Al-Kahf is recommended to be read every Friday — it's a Surah of protection, especially from the trials of the Dajjal (the false messiah). It tells four powerful stories, each addressing a different test: faith under persecution, the temptation of wealth, the limits of knowledge, and the misuse of power.", tafsir: "The People of the Cave were young believers who fled persecution and were miraculously preserved in sleep for centuries — a story about staying firm in faith even when it means isolation. The story of the two garden owners warns against arrogance over wealth. The story of Musa and Khidr humbles even a prophet, showing that Allah's knowledge is limitless and some things only make sense from a higher perspective. The story of Dhul-Qarnayn shows how power, when used with justice and humility before Allah, becomes a blessing rather than corruption. Together, these stories form a shield against the greatest fitna (trial) — that of the Dajjal.", favoriteAyah: { arabic: "وَلَا تَقُولَنَّ لِشَيْءٍ إِنِّي فَاعِلٌ ذٰلِكَ غَدًا إِلَّا أَن يَشَاءَ اللَّهُ", english: "And never say about anything, 'I will do that tomorrow,' except [add], 'If Allah wills.'", explanation: "A small phrase — inshaAllah — that carries huge meaning. It reminds us that nothing happens except by Allah's will, keeping our hearts humble about the future." }, dua: "O Allah, protect me from every trial — of faith, wealth, knowledge, and power. Let me always remember that everything happens by Your will alone, and grant me the patience of the People of the Cave when faith feels difficult. Ameen." },
    { number: 19, arabic: "مريم", name: "Maryam", meaning: "Mary", type: "Makki", ayahs: 98, themes: ["Story of Maryam and the miraculous birth of Isa", "Prophet Zakariyya's dua for a child", "Prophet Ibrahim's gentle call to his father", "Mercy and compassion in dawah"], summary: "Surah Maryam is named after Maryam (Mary), the mother of Isa (Jesus) — the only woman named directly in the Quran's chapter titles. It tells her story with incredible tenderness, alongside the stories of Zakariyya, Yahya, Ibrahim, and Musa — all united by themes of mercy, longing, and devotion.", tafsir: "The Surah opens with Zakariyya's heartfelt dua for a child in his old age — a beautiful model for how to ask Allah for things that seem impossible. Maryam's story follows: her isolation, the angel's announcement, and the miraculous birth of Isa without a father — proof of Allah's power over all things. The Surah also shows Ibrahim speaking to his idol-worshipping father with such gentleness ('O my father...') — even when rejected, he responds with mercy, not anger. The recurring theme is Ar-Rahman, the Most Merciful — Allah's name used throughout to emphasize His compassion even toward those who struggle to believe.", favoriteAyah: { arabic: "فَخَلَفَ مِن بَعْدِهِمْ خَلْفٌ أَضَاعُوا الصَّلَاةَ وَاتَّبَعُوا الشَّهَوَاتِ", english: "Then there came after them a generation who neglected prayer and pursued desires.", explanation: "A sobering warning that resonates deeply today — when prayer is neglected and desires take priority, a society drifts. It's a call to protect our salah above all." }, dua: "O Allah, like Zakariyya, I bring my hopes to You even when they seem impossible. Like Maryam, grant me patience through isolation and trial. And like Ibrahim, give me a gentle heart toward those who don't yet understand the truth. Ameen." },
    { number: 20, arabic: "طه", name: "Taha", meaning: "Ta-Ha", type: "Makki", ayahs: 135, themes: ["The full story of Musa and Pharaoh", "Comfort and reassurance for the Prophet", "The Quran was not sent to cause hardship", "Adam's story and the importance of forgetting vs. remembering Allah"], summary: "Taha tells the detailed story of Musa — from his calling at the burning bush, to confronting Pharaoh, to the parting of the sea. Woven throughout is a tender message to the Prophet Muhammad ﷺ: the Quran was sent to bring ease, not distress.", tafsir: "The Surah opens by reassuring the Prophet that the Quran was 'not sent down to cause distress' — it's a mercy, a reminder for those who fear Allah. Musa's story is told with incredible detail: his fear when speaking to Pharaoh, his dua for his brother Harun to help him, and the moment his staff turned into a snake. The story of Adam is also retold — emphasizing that 'forgetting' (Adam forgot the covenant) is part of human nature, but returning to Allah through repentance is always the way back. The Surah ends with a beautiful reminder to be patient with what people say and to glorify Allah throughout the day and night.", favoriteAyah: { arabic: "رَبِّ زِدْنِي عِلْمًا", english: "My Lord, increase me in knowledge.", explanation: "One of the shortest yet most powerful duas in the Quran — a request that never expires. No matter how much you know, there's always more to learn about Allah, His deen, and yourself." }, dua: "O Allah, increase me in knowledge — of You, of Your deen, and of myself. Like Musa, give me courage when I feel afraid, and like the message of this Surah, let the Quran be a source of ease in my life, not burden. Ameen." },
    { number: 21, arabic: "الأنبياء", name: "Al-Anbiya", meaning: "The Prophets", type: "Makki", ayahs: 112, themes: ["Stories of many prophets in brief", "Every prophet faced rejection but stayed firm", "Mercy to all the worlds", "Tawheed as the core message of every prophet"], summary: "Al-Anbiya moves quickly through the stories of many prophets — Ibrahim, Nuh, Dawud, Sulaiman, Ayyub, Yunus, and more — showing that despite their different times and places, they all carried the same message: there is no god but Allah.", tafsir: "Each story in this Surah is brief but packed with lessons. Ayyub's patience through illness, Yunus's dua in the belly of the whale ('La ilaha illa Anta, Subhanaka, inni kuntu minaz-zalimin'), and Ibrahim's destruction of the idols — all show different forms of strength in faith. The Surah's central message comes in verse 107: the Prophet Muhammad ﷺ was sent as a mercy to all the worlds — not just to one group of people, but to everyone, for all time. It's a reminder that Islam's message is universal and timeless.", favoriteAyah: { arabic: "وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِّلْعَالَمِينَ", english: "And We have not sent you, [O Muhammad], except as a mercy to the worlds.", explanation: "This single verse defines the entire purpose of the Prophet's mission — and by extension, the purpose of Islam itself: mercy. Not harshness, not control — mercy, to everyone." }, dua: "O Allah, like Yunus in his darkest moment, I turn to You and declare there is no god but You. Let the mercy that defined the Prophet's mission be reflected in how I treat others, and grant me the patience of Ayyub through every trial. Ameen." },
    { number: 22, arabic: "الحج", name: "Al-Hajj", meaning: "The Pilgrimage", type: "Madani", ayahs: 78, themes: ["Hajj and its spiritual significance", "Resurrection and the reality of the Hour", "Standing up for truth even when persecuted", "Striving in Allah's cause"], summary: "Al-Hajj discusses the pilgrimage to Makkah — its history, rituals, and deeper meaning — while also addressing the reality of resurrection and the struggles believers face for standing up for truth.", tafsir: "The Surah opens with vivid imagery of the Day of Judgment — designed to shake the heart awake. It then moves to the story of Ibrahim and Ismail building the Ka'bah and Ibrahim's call for people to perform Hajj — a call Allah says reaches across all time, even to us today. The Surah explains that Hajj rituals are not about the animals sacrificed, but about the taqwa (God-consciousness) behind the act: 'It is not their meat or blood that reaches Allah, but it is your piety that reaches Him.' The final verses encourage believers to 'strive for Allah with the striving due to Him' — true effort in faith, not half-hearted.", favoriteAyah: { arabic: "لَن يَنَالَ اللَّهَ لُحُومُهَا وَلَا دِمَاؤُهَا وَلَٰكِن يَنَالُهُ التَّقْوَىٰ مِنكُمْ", english: "Their meat will not reach Allah, nor will their blood, but what reaches Him is piety from you.", explanation: "A reminder that Allah doesn't need our acts of worship — He wants the sincerity and God-consciousness behind them. It's never about the ritual alone; it's about the heart." }, dua: "O Allah, let every act of worship I do be filled with sincere taqwa, not just outward motion. Whether I ever stand at the Ka'bah or not, let my heart always be turned toward You with devotion. Ameen." },
    { number: 23, arabic: "المؤمنون", name: "Al-Muminun", meaning: "The Believers", type: "Makki", ayahs: 118, themes: ["Qualities of successful believers", "Stages of human creation", "Stories of prophets and their nations", "The reality of this worldly life vs. the hereafter"], summary: "Al-Muminun opens with one of the most beloved lists in the Quran — the qualities of believers who will be successful: those who pray with humility, avoid vain talk, give charity, guard their chastity, and are trustworthy. It's essentially a character checklist for the soul.", tafsir: "The opening verses (23:1-11) describe 'al-mu'minun al-muflihun' — the successful believers — and these qualities form a practical roadmap for spiritual growth. The Surah then describes the stages of human creation in the womb in remarkable detail, a sign for those who reflect on Allah's power. It revisits the stories of Nuh and Musa to show the pattern of rejection prophets faced. The closing verses powerfully address those who think life on earth is everything, asking: 'Did you think We created you uselessly and that you would not be returned to Us?'", favoriteAyah: { arabic: "قَدْ أَفْلَحَ الْمُؤْمِنُونَ الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ", english: "Successful indeed are the believers — those who are humbly submissive in their prayer.", explanation: "True success doesn't start with wealth or status — it starts with how present and humble you are when you stand before Allah in prayer." }, dua: "O Allah, make me among the successful believers described in this Surah — humble in prayer, truthful in speech, trustworthy in my dealings, and mindful that this life is not all there is. Ameen." },
    { number: 24, arabic: "النور", name: "An-Nur", meaning: "The Light", type: "Madani", ayahs: 64, themes: ["Allah as the Light of the heavens and earth", "Modesty, privacy, and protecting honor", "Guarding against false accusations", "Light upon light — the parable of guidance"], summary: "An-Nur contains the breathtakingly beautiful 'Ayat An-Nur' (Verse of Light) describing Allah's guidance as light upon light. The Surah also lays out important guidance on modesty, privacy in homes, and protecting people's honor from slander.", tafsir: "The famous Light Verse (24:35) compares Allah's guidance to a lamp in a niche, its glass shining like a star, lit from a blessed olive tree — layers of light upon light, illuminating the believer's heart. The Surah also addresses a real historical incident (the slander against the Prophet's wife Aisha) to teach the seriousness of spreading rumors without evidence — and the comfort that Allah defends the innocent. Guidance on modesty in dress and behavior, and etiquette for entering others' homes, are also given — all rooted in protecting dignity, privacy, and trust within the community.", favoriteAyah: { arabic: "اللَّهُ نُورُ السَّمَاوَاتِ وَالْأَرْضِ", english: "Allah is the Light of the heavens and the earth.", explanation: "One of the most beautiful descriptions of Allah in the entire Quran. When everything feels dark, remember — the source of all light, guidance, and clarity is Allah Himself." }, dua: "O Allah, You are the Light of the heavens and the earth — light up my heart with guidance, protect my honor and the honor of others, and let me never be among those who spread doubt or slander without knowledge. Ameen." },
    { number: 25, arabic: "الفرقان", name: "Al-Furqan", meaning: "The Criterion", type: "Makki", ayahs: 77, themes: ["The Quran as the Criterion between right and wrong", "Qualities of the 'servants of the Most Merciful'", "Responses to the disbelievers' objections", "Regret of the wrongdoers on Judgment Day"], summary: "Al-Furqan means 'the criterion' — the standard that distinguishes truth from falsehood. The Surah responds to the Makkans' objections about the Prophet and the Quran, and closes with a stunning description of the 'Ibad ar-Rahman' — the servants of the Most Merciful.", tafsir: "The disbelievers mocked the Prophet, asking why a 'mere man' was given revelation, or why angels weren't sent instead. The Surah responds patiently, reminding that even previous prophets ate, walked, and lived ordinary lives. The final section (25:63-77) describes the qualities of Allah's beloved servants: they walk humbly, respond to ignorance with peace, spend the night in prayer, fear the punishment of Hell even while doing good, and ask Allah for spouses and children who bring them joy and become leaders for the righteous. This passage is often used as a personal character goal for Muslims.", favoriteAyah: { arabic: "وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا", english: "And the servants of the Most Merciful are those who walk upon the earth with ease and humility.", explanation: "Humility isn't weakness — it's the defining trait of those Allah calls His beloved servants. This verse begins a list of character traits worth aspiring to every single day." }, dua: "O Allah, make me among the 'Ibad Ar-Rahman' — humble in how I walk and speak, peaceful in how I respond to ignorance, and devoted in the quiet hours of the night. Grant me a family that brings me joy and draws me closer to You. Ameen." },
    { number: 26, arabic: "الشعراء", name: "Ash-Shuara", meaning: "The Poets", type: "Makki", ayahs: 227, themes: ["Stories of Musa, Ibrahim, Nuh, Lut, Shuaib and others", "The Quran is not poetry but divine truth", "Each prophet's people rejected and were destroyed", "Following truth over false eloquence"], summary: "Ash-Shuara walks through the stories of many prophets — each facing rejection from their people, each delivering essentially the same message: fear Allah and obey His messenger. The Surah closes by clarifying that the Quran is not the work of poets, but divine revelation.", tafsir: "Each story in this Surah follows a similar rhythm: the prophet calls his people, they reject him citing tradition or mockery, and consequence follows. Musa's confrontation with Pharaoh's magicians is told dramatically — when Musa's staff swallows their illusions, the magicians immediately believe, showing that truth, once clearly seen, is undeniable even to those trained in deception. The closing verses defend the Quran against accusations that it was composed like the poetry of Makkah's poets — clarifying that real poets wander aimlessly and say what they don't do, while the Quran is consistent truth meant to be lived.", favoriteAyah: { arabic: "وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ", english: "And when I am ill, it is He who cures me.", explanation: "Spoken by Ibrahim, this verse is a quiet reminder during sickness — every recovery, every healing, ultimately comes from Allah, not just medicine alone." }, dua: "O Allah, when I am sick, You are the One who heals. When I face rejection for standing on truth, give me the steadiness shown by the prophets in this Surah. Let me always recognize truth when I see it, even if it goes against tradition or popular opinion. Ameen." },
    { number: 27, arabic: "النمل", name: "An-Naml", meaning: "The Ant", type: "Makki", ayahs: 93, themes: ["Story of Sulaiman and the Queen of Sheba", "The ant and the hoopoe bird as signs", "Musa at the burning bush", "Gratitude for Allah's gifts of knowledge and power"], summary: "An-Naml tells the wonderful story of Prophet Sulaiman — who could understand the speech of animals, including an ant warning its colony, and a hoopoe bird who brought him news of the Queen of Sheba. It's a Surah full of wonder, wisdom, and gratitude.", tafsir: "The story of the ant (27:18) shows a tiny creature warning others to take shelter from Sulaiman's army — and Sulaiman, hearing this, smiles and thanks Allah for the gift of understanding it, asking to be among the righteous. This humility despite immense power is the heart of the Surah. The story of the Queen of Sheba (Bilqis) shows her wisdom in seeking truth — when she saw Sulaiman's throne and the reality of his message, she submitted to Allah rather than clinging to pride. The Surah closes by reminding that all power and knowledge are gifts from Allah, deserving gratitude, not arrogance.", favoriteAyah: { arabic: "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ", english: "My Lord, enable me to be grateful for Your favor which You have bestowed upon me.", explanation: "Said by Sulaiman, one of the most powerful kings in history — yet his immediate response to a blessing was to ask Allah for the ability to be grateful. Even gratitude itself is a gift we should ask for." }, dua: "O Allah, like Sulaiman, grant me the gratitude to recognize every blessing as coming from You — and the humility to never let knowledge, power, or success make my heart arrogant. Ameen." },
    { number: 28, arabic: "القصص", name: "Al-Qasas", meaning: "The Stories", type: "Makki", ayahs: 88, themes: ["The full story of Musa's life from birth to prophethood", "Story of Qarun and the danger of arrogance over wealth", "Allah's plan working even through hardship", "Trusting Allah's promise of help"], summary: "Al-Qasas tells the complete story of Musa — his birth during Pharaoh's genocide, his mother's incredible trust placing him in the river, his years in Madyan, and his return as a prophet. It also tells the cautionary story of Qarun, a wealthy man who thought his riches were entirely his own doing.", tafsir: "The story of Musa's mother is deeply moving — commanded to place her baby in a river to save him from Pharaoh's soldiers, she trusted Allah completely, and Allah returned her son to her, fulfilling His promise that 'indeed, We will return him to you.' This shows that even the most painful, faith-testing moments can end in Allah's mercy in ways we can't foresee. Qarun, on the other hand, was given immense wealth and said 'I was only given this because of knowledge I have' — and was swallowed into the earth as a consequence of his arrogance. The Surah teaches that everything we have is a trust from Allah, never something we 'earned' independent of Him.", favoriteAyah: { arabic: "إِنَّ الَّذِي فَرَضَ عَلَيْكَ الْقُرْآنَ لَرَادُّكَ إِلَىٰ مَعَادٍ", english: "Indeed, He who has imposed the Quran upon you will surely return you to a place of return.", explanation: "A promise of return — to safety, to home, to Allah. Whatever you feel separated from right now, trust that Allah's promise of return is real." }, dua: "O Allah, like Musa's mother, give me the trust to place my fears in Your hands when things feel impossible. Protect me from the arrogance of Qarun, and remind me that every blessing I have is from You alone. Ameen." },
    { number: 29, arabic: "العنكبوت", name: "Al-Ankabut", meaning: "The Spider", type: "Makki", ayahs: 69, themes: ["Trials are a natural part of faith", "The spider's web as a metaphor for false reliance", "Stories of Nuh, Ibrahim, Lut and their patience", "The Quran as proof and guidance"], summary: "Al-Ankabut opens with a profound truth: people will be tested in their faith, and those tests reveal who is sincere. The spider's web is used as a powerful metaphor — anything relied upon besides Allah is as fragile and useless as a spider's home.", tafsir: "The opening verses (29:1-3) ask: 'Do people think they will be left alone because they say \"We believe\" and not be tested?' This sets the tone — faith without trial isn't proven faith. The metaphor of the spider's web (29:41) describes those who take protectors besides Allah as building something with no real strength — a web looks intricate but offers no real shelter. The stories of Nuh (who called his people for 950 years), Ibrahim (who was thrown into fire for his beliefs), and Lut all demonstrate sabr through long, difficult trials, with Allah's help arriving exactly when needed — never too early, never too late.", favoriteAyah: { arabic: "أَحَسِبَ النَّاسُ أَن يُتْرَكُوا أَن يَقُولُوا آمَنَّا وَهُمْ لَا يُفْتَنُونَ", english: "Do the people think that they will be left to say, 'We believe' and they will not be tried?", explanation: "A direct, honest question. If you're going through difficulty as a believer, this verse says: this is normal, this is expected, this is part of the path." }, dua: "O Allah, when trials come, let them strengthen my faith rather than shake it. Remind me that anything I rely on besides You is as fragile as a spider's web, and that Your help comes at exactly the right time. Ameen." },
    { number: 30, arabic: "الروم", name: "Ar-Rum", meaning: "The Romans", type: "Makki", ayahs: 60, themes: ["Prophecy about the Romans' victory", "Signs of Allah in the heavens, earth, and within ourselves", "Rise and fall of nations as a pattern", "Hope after despair"], summary: "Ar-Rum opens with a remarkable prophecy — that the defeated Romans would rise again and win, which happened exactly as foretold. The Surah then turns to signs of Allah everywhere: in the skies, in marriage, in the diversity of languages and colors, and in our own selves.", tafsir: "This Surah was revealed when the Persians had just defeated the Romans, and the Quran predicted the Romans would be victorious again within a set number of years — a prophecy that came true, amazing even the skeptics. Beyond this historical sign, the Surah points to everyday signs of Allah's power: the way sleep and rest restore us, the way spouses find tranquility in each other (mentioned in the famous verse 30:21), and the cycles of rain bringing life to dead land. The Surah's message is one of hope — just as the Romans rose after defeat, just as dead land comes back to life with rain, Allah can bring renewal after any period of despair.", favoriteAyah: { arabic: "وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّحَبَّةً وَرَحْمَةً", english: "And of His signs is that He created for you spouses that you may find tranquility in them, and He placed between you love and mercy.", explanation: "One of the most beloved verses about marriage in the Quran — describing it not just as a relationship, but as a sign of Allah's mercy, built on love and tranquility." }, dua: "O Allah, just as You bring dead land back to life with rain, and just as the Romans rose again after defeat, bring renewal and hope into my life after every period of hardship. Let me see Your signs in the world around me and within my own heart. Ameen." },

// Curated favorite ayahs + duas for select well-known surahs 31-114
const EXTRA_AYAHS = {
    31: { favoriteAyah: { arabic: "وَإِن جَاهَدَاكَ عَلَىٰ أَن تُشْرِكَ بِي مَا لَيْسَ لَكَ بِهِ عِلْمٌ فَلَا تُطِعْهُمَا", english: "But if they strive to make you associate with Me that of which you have no knowledge, do not obey them.", explanation: "Even within Luqman's beautiful advice to honor parents, this verse draws a clear line: obedience to parents never overrides obedience to Allah. Love and respect them, but truth comes first." }, dua: "O Allah, grant me the wisdom of Luqman — to raise my heart and the hearts of those I love with gentleness, gratitude, and unwavering devotion to You above all else. Ameen." },
    32: { favoriteAyah: { arabic: "تَتَجَافَىٰ جُنُوبُهُمْ عَنِ الْمَضَاجِعِ يَدْعُونَ رَبَّهُمْ خَوْفًا وَطَمَعًا", english: "They arise from [their] beds, supplicating their Lord in fear and hope.", explanation: "A description of those who wake in the night to pray — torn between fear of falling short and hope in Allah's mercy. A beautiful image of sincere devotion when no one is watching." }, dua: "O Allah, grant me the discipline to rise in the night and call upon You, in fear of Your punishment and hope for Your mercy. Let my private worship be as sincere as my public deeds. Ameen." },
    33: { favoriteAyah: { arabic: "إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ", english: "Indeed, Allah confers blessing upon the Prophet, and His angels [ask Him to do so].", explanation: "A reminder of the honor given to the Prophet ﷺ — and an invitation for us to send our own salawat upon him, connecting us to this chain of blessing." }, dua: "O Allah, send Your peace and blessings upon Prophet Muhammad ﷺ, and grant me the steadfastness shown by the believers during the Battle of the Trench — trusting You even when the situation feels overwhelming. Ameen." },
    34: { favoriteAyah: { arabic: "وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِّلنَّاسِ بَشِيرًا وَنَذِيرًا", english: "And We have not sent you except comprehensively to mankind, as a bringer of good tidings and a warner.", explanation: "The Prophet's message wasn't for one tribe or era — it was for all of humanity, carrying both glad tidings and sincere warning, out of mercy." }, dua: "O Allah, like the people of Sheba, do not let me become ungrateful for Your blessings. Keep my heart soft, my gratitude constant, and my trust in You unwavering even when things change. Ameen." },
    35: { favoriteAyah: { arabic: "مَا يَفْتَحِ اللَّهُ لِلنَّاسِ مِن رَّحْمَةٍ فَلَا مُمْسِكَ لَهَا", english: "Whatever Allah grants to people of mercy, none can withhold it.", explanation: "When Allah decides to bless you, nothing and no one can stop it. And when He withholds, nothing can force it. All control belongs to Him alone — a deeply freeing truth." }, dua: "O Allah, You are Al-Fatir, the Originator of all things. Whatever mercy You wish to send my way, let no one stand in its path. And let me trust completely in Your timing and Your plan. Ameen." },
    36: { favoriteAyah: { arabic: "إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن فَيَكُونُ", english: "His command is only when He intends a thing that He says to it, 'Be,' and it is.", explanation: "Often called the Heart of the Quran, Ya-Sin reminds us of Allah's effortless power — He doesn't struggle to create or change anything. One word, and it happens. Nothing is too hard for Him." }, dua: "O Allah, You who say 'Be' and it is — nothing is difficult for You. Whatever feels impossible in my life, make it possible by Your command. Bring ease where there is hardship, and life where there feels like none. Ameen." },
    37: { favoriteAyah: { arabic: "رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ", english: "My Lord, grant me [a child] from among the righteous.", explanation: "Ibrahim's dua for righteous offspring — a simple, heartfelt request that any parent can make, asking not for wealth or fame for their children, but for righteousness." }, dua: "O Allah, like Ibrahim, grant me righteous children, righteous companions, and a righteous heart of my own. Let my family be a source of nearness to You, not distance from You. Ameen." },
    38: { favoriteAyah: { arabic: "إِنَّا وَجَدْنَاهُ صَابِرًا ۚ نِّعْمَ الْعَبْدُ", english: "Indeed, We found him patient, an excellent servant.", explanation: "Said about Prophet Ayyub (Job), who endured immense illness and loss with patience. Allah Himself calls him 'an excellent servant' — patience through suffering is one of the highest forms of worship." }, dua: "O Allah, like Ayyub, give me the patience to endure illness, loss, and hardship without complaint to anyone but You. Let me remain Your excellent servant in ease and in difficulty alike. Ameen." },
    39: { favoriteAyah: { arabic: "قُل يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ", english: "Say: O My servants who have transgressed against themselves, do not despair of the mercy of Allah.", explanation: "One of the most hope-filled verses in the entire Quran — no matter how much you feel you've messed up, Allah's mercy is wide open. Despair itself is what He warns against, not your sins alone." }, dua: "O Allah, no matter how much I have fallen short, I do not despair of Your mercy. Forgive my sins, accept my repentance, and never let shame keep me from turning back to You. Ameen." },
    40: { favoriteAyah: { arabic: "وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ", english: "And your Lord says, 'Call upon Me; I will respond to you.'", explanation: "A direct promise from Allah Himself — call upon Him, and He responds. Not maybe, not sometimes — a guarantee, even if the response isn't always in the form or timing we expect." }, dua: "O Allah, You promised that if I call upon You, You will respond. I call upon You now — answer my dua in the way that is best for me, and never let me stop calling on You. Ameen." },
    41: { favoriteAyah: { arabic: "وَنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ", english: "And We send down of the Quran that which is healing and mercy for the believers.", explanation: "The Quran isn't just guidance — it's described as shifa, healing. For a heart that's hurting, anxious, or lost, returning to the Quran is returning to medicine for the soul." }, dua: "O Allah, let the Quran be a healing for my heart — for every wound, every worry, every doubt. Let its words settle into my chest as mercy, exactly as You described. Ameen." },
    42: { favoriteAyah: { arabic: "وَجَزَاءُ سَيِّئَةٍ سَيِّئَةٌ مِّثْلُهَا ۖ فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُ عَلَى اللَّهِ", english: "But whoever pardons and makes reconciliation — his reward is with Allah.", explanation: "Justice allows for an equal response to wrong — but forgiveness is presented as the higher path, with a reward directly from Allah. Choosing peace over revenge is rewarded immensely." }, dua: "O Allah, when I am wronged, give me the strength to choose forgiveness and reconciliation over revenge, trusting that my reward for doing so is with You alone. Ameen." },
    43: { favoriteAyah: { arabic: "وَلَوْلَا أَن يَكُونَ النَّاسُ أُمَّةً وَاحِدَةً لَّجَعَلْنَا لِمَن يَكْفُرُ بِالرَّحْمَٰنِ لِبُيُوتِهِمْ سُقُفًا مِّن فِضَّةٍ", english: "And if it were not that all the people would become of one [evil] community, We would have made for those who disbelieve in the Most Merciful, houses with roofs of silver.", explanation: "A striking reminder that worldly wealth is not a sign of Allah's approval — if it were given freely to everyone based on disbelief alone, people would be misled by appearances. True value lies elsewhere." }, dua: "O Allah, do not let me measure success or Your love by wealth or appearances. Let me see this world for what it truly is, and keep my eyes fixed on the eternal home instead. Ameen." },
    44: { favoriteAyah: { arabic: "إِنَّا أَنزَلْنَاهُ فِي لَيْلَةٍ مُّبَارَكَةٍ", english: "Indeed, We sent it down during a blessed night.", explanation: "Referring to Laylat al-Qadr, the night the Quran's revelation began — a night so blessed it's described as better than a thousand months. A reminder to seek it every Ramadan." }, dua: "O Allah, let me witness and benefit from the blessed nights You have placed in this life — especially Laylat al-Qadr. Multiply my good deeds in ways I cannot imagine, and accept my worship during these sacred times. Ameen." },
    45: { favoriteAyah: { arabic: "وَفِي خَلْقِكُمْ وَمَا يَبُثُّ مِن دَابَّةٍ آيَاتٌ لِّقَوْمٍ يُوقِنُونَ", english: "And in your creation, and in what He disperses of moving creatures, are signs for people who are certain [in faith].", explanation: "Allah's signs aren't hidden in distant places — they're in your own body, in the creatures around you. Certainty of faith comes from really looking at what's already in front of you." }, dua: "O Allah, open my eyes to Your signs in my own creation and in the world around me. Let reflection on these signs increase my certainty in You, not just my knowledge. Ameen." },
    46: { favoriteAyah: { arabic: "فَاصْبِرْ كَمَا صَبَرَ أُولُو الْعَزْمِ مِنَ الرُّسُلِ", english: "So be patient, [O Muhammad], as those of determination among the messengers were patient.", explanation: "A direct instruction to embody the patience of the greatest prophets — Nuh, Ibrahim, Musa, Isa, and Muhammad ﷺ — known as the 'Ulul Azm,' the messengers of firm resolve." }, dua: "O Allah, grant me the patience of the messengers of firm resolve — the patience that doesn't just endure, but endures with grace, dignity, and unwavering trust in You. Ameen." },
    47: { favoriteAyah: { arabic: "فَإِن تَتَوَلَّوْا يَسْتَخْلِفْ قَوْمًا غَيْرَكُمْ ثُمَّ لَا يَكُونُوا أَمْثَالَكُم", english: "And if you turn away, He will replace you with another people; then they will not be like you.", explanation: "A sobering reminder that no individual or community is irreplaceable in carrying Allah's message — staying true to faith is a privilege, not a guarantee, and shouldn't be taken lightly." }, dua: "O Allah, do not let me take the privilege of faith for granted. Keep me firm on this path, and let me never become someone who turns away after having known the truth. Ameen." },

        }

    }

    "yusuf": { name: "Prophet Yusuf (Joseph) ﷺ", icon: "🌙", story: "Yusuf was the beloved son of Prophet Ya'qub (Jacob), and his brothers, consumed by jealousy, threw him into a well and left him for dead. He was found by travelers and sold into slavery in Egypt. There, he resisted a powerful woman's attempt to seduce him, was falsely imprisoned, and eventually rose to a position of great authority by interpreting the king's dreams. Years later, his brothers came to Egypt during a famine — not recognizing him — and Yusuf, instead of taking revenge, forgave them completely and reunited his family. His story, called 'the best of stories' in the Quran, is about patience through betrayal and the way Allah can turn the deepest pain into something beautiful." },
